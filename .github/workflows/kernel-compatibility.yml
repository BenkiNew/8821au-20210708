name: Kernel compatibility CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['core/**', 'hal/**', 'include/**', 'os_dep/**', 'Makefile', '.github/workflows/kernel-compatibility.yml']
  pull_request:
    branches: [main]
    paths: ['core/**', 'hal/**', 'include/**', 'os_dep/**', 'Makefile', '.github/workflows/kernel-compatibility.yml']
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kernel: ['7.0', '7.1', '7.2.8']
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential flex bison libelf-dev libssl-dev bc
      - name: Prepare upstream kernel
        env:
          KERNEL_VERSION: ${{ matrix.kernel }}
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output kernel.tar.xz "https://www.kernel.org/pub/linux/kernel/v7.x/linux-${KERNEL_VERSION}.tar.xz"
          tar -xf kernel.tar.xz
          make -C "linux-${KERNEL_VERSION}" defconfig
          "linux-${KERNEL_VERSION}/scripts/config" --file "linux-${KERNEL_VERSION}/.config" --disable MODVERSIONS
          make -C "linux-${KERNEL_VERSION}" olddefconfig modules_prepare -j2
      - name: Compile driver (never install or load)
        env:
          KERNEL_VERSION: ${{ matrix.kernel }}
        run: make -j2 KSRC="$RUNNER_TEMP/linux-${KERNEL_VERSION}" KVER="$KERNEL_VERSION" KBUILD_MODPOST_WARN=1
